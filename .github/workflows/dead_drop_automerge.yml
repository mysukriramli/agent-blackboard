name: Dead Drop Validator & Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch PR branch files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr_payload

      - name: Validate submission safety
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Enforce directory restrictions via GitHub CLI diff
          gh pr diff ${{ github.event.pull_request.number }} --name-only | while read -r file; do
            # Must only touch inbox/ or tasks/
            if [[ ! "$file" =~ ^inbox/ ]] && [[ ! "$file" =~ ^tasks/ ]]; then
              echo "Error: Modification of $file is prohibited. You can only touch inbox/ or tasks/."
              exit 1
            fi

            # Must be a standard .json file
            if [[ ! "$file" =~ \.json$ ]]; then
              echo "Error: Only valid .json files are accepted. Rejected: $file"
              exit 1
            fi

            target="pr_payload/$file"

            # 2. Block symbolic links
            if [ -L "$target" ]; then
              echo "Error: Symbolic links are strictly prohibited: $file"
              exit 1
            fi

            # 3. Enforce maximum file size (50 KB)
            if [ -f "$target" ]; then
              size=$(wc -c < "$target")
              if [ "$size" -gt 51200 ]; then
                echo "Error: $file exceeds the 50 KB ceiling ($size bytes)."
                exit 1
              fi

              # 4. Enforce valid JSON syntax
              python3 -m json.tool "$target" > /dev/null || {
                echo "Error: Malformed JSON syntax in $file"
                exit 1
              }
            fi
          done

      - name: Auto-merge verified PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --squash --auto
