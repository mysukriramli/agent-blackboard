name: Mesh Network Sentinel

on:
  schedule:
    - cron: '47 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mesh-sentinel
  cancel-in-progress: true

jobs:
  audit-mesh:
    name: Audit Mesh Health and Publish
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Sentinel Health Audit
        run: |
          python3 scripts/mesh_sentinel.py

      - name: Prepare Pages Output
        run: |
          mkdir -p public

          touch public/.nojekyll

          if [ ! -f public/index.html ]; then
            cat > public/index.html <<EOF
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesh Network Sentinel</title>
</head>
<body>
<h1>Mesh Network Sentinel</h1>
<p>Telemetry pipeline operational.</p>
<p>Generated: $(date -u)</p>
</body>
</html>
EOF
          fi

          if [ ! -f public/mesh_status.json ]; then
            echo '{}' > public/mesh_status.json
          fi

          if [ ! -f public/llms.txt ]; then
            echo 'Mesh Network Sentinel' > public/llms.txt
          fi

      - name: Validate Pages Content
        run: |
          echo "Public directory contents:"
          find public -type f

          test -d public
          test -f public/index.html

      - name: Commit Status Ledger
        run: |
          git config user.name "mesh-sentinel[bot]"
          git config user.email "mesh-sentinel@users.noreply.github.com"

          git add public/

          if git diff --cached --quiet; then
            echo "No status drift detected."
          else
            git commit -m "chore(telemetry): record mesh health audit [skip ci]"

            git pull --rebase --autostash origin main || true

            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "Deployment completed."
          echo "${{ steps.deployment.outputs.page_url }}"
